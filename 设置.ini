; 拼音选中回改 配置文件
; 改完在托盘菜单点「重新加载」。所有值均为 ASCII。
; 详细说明见 README.md「设置项」一节。

[trigger]
; 触发键：LShift / RShift
Key=LShift
; 按住超过多少毫秒不触发
HoldMaxMs=320
; 抬起后等输入法完成切换的时间(ms)
SettleMs=180

[ime]
; 输入法自己的"中英切换键"。物理按键会自己触发它；这个值用于工具"补切"时模拟。
; 可选：LShift / RShift / Ctrl+Space / Ctrl+Shift / Win+Space / Ctrl / 任意 AHK 按键表达式
ToggleKey=LShift
; 读不到输入法状态时，是否假定"触发键已把输入法切到中文"
; 1=假定（微软拼音/搜狗/微信等 Shift 切换的默认情况）
; 0=读不到就放弃
AssumeNative=1
; 中英文是"两套键盘布局"时填中文语言 ID：0x0804；同一种输入法内切换则填 0
RequiredLangId=0

[replay]
; 回灌拼音时每个字母的按下时长 / 字母间隔(ms)。某些程序吃键慢就加大。
PressMs=22
GapMs=26

[ui]
; 出错时是否在鼠标旁弹提示：1/0
TipErrors=1